name: green_cycle
description: A new Flutter project.

publish_to: "none"
version: 1.0.3+7

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.2
  dio: ^5.3.2
  flutter_screenutil: ^5.9.0
  flutter_smart_dialog: ^5.1.0
  flutter_spinkit: ^5.2.0
  flutter_svg: ^2.0.7
  form_builder_validators: ^11.3.0
  get: ^4.6.5
  get_storage: ^2.1.1
  intl: ^0.20.2
  pin_code_fields: ^9.1.0
  curved_navigation_bar: ^1.0.3
  flutter_launcher_icons: ^0.14.4
  image_picker: ^1.0.4
  upgrader: ^12.5.0
  url_launcher: ^6.3.1

dependency_overrides:
  url_launcher_ios: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Montserrat-Arabic
      fonts:
        - asset: assets/fonts/Montserrat-Arabic900.otf
          weight: 900
        - asset: assets/fonts/Montserrat-Arabic800.otf
          weight: 800
        - asset: assets/fonts/Montserrat-Arabic700.otf
          weight: 700
        - asset: assets/fonts/Montserrat-Arabic600.otf
          weight: 600
        - asset: assets/fonts/Montserrat-Arabic500.otf
          weight: 500
        - asset: assets/fonts/Montserrat-Arabic400.otf
          weight: 400
        - asset: assets/fonts/Montserrat-Arabic300.otf
          weight: 300
        - asset: assets/fonts/Montserrat-Arabic250.otf
          weight: 200
